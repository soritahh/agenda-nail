<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agenda Nail</title>
  <meta name="description" content="Agenda de turnos para manicuras independientes.">
  <meta name="theme-color" content="#f07a86">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icono-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div id="splash" class="splash" hidden>
    <div class="splash-contenido">
      <img src="icons/icono.svg" alt="" class="splash-logo" width="96" height="96">
      <h1 class="splash-titulo">Agenda Nail</h1>
      <p class="splash-sub">Tus turnos, clientas y servicios en un solo lugar.</p>
      <form id="form-splash" class="splash-form" novalidate>
        <div class="campo">
          <label for="splash-nombre">¿Cómo te llamas o cómo se llama tu salón?</label>
          <input id="splash-nombre" name="nombre" type="text" maxlength="60" autocomplete="name" placeholder="Ej.: Sofi Nails">
        </div>
        <button type="submit" class="btn btn-primario btn-grande">Empezar</button>
      </form>
    </div>
  </div>

  <div id="app" class="app" hidden>
    <main id="contenido" class="contenido" tabindex="-1"></main>

    <nav class="nav-inferior" aria-label="Navegación principal">
      <a href="#/inicio" data-nav="inicio">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>
        <span>Inicio</span>
      </a>
      <a href="#/agenda" data-nav="agenda">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>Agenda</span>
      </a>
      <a href="#/clientas" data-nav="clientas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        <span>Clientas</span>
      </a>
      <a href="#/servicios" data-nav="servicios">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6v4H9zM8 7h8l1 4v9a1 1 0 01-1 1H8a1 1 0 01-1-1v-9z"/></svg>
        <span>Servicios</span>
      </a>
      <a href="#/ajustes" data-nav="ajustes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
        <span>Ajustes</span>
      </a>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">Agenda Nail necesita JavaScript activado.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
